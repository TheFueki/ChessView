services:
  postgres:
    image: postgres:16
    container_name: chessview-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: chessview-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      STORAGE_DIR: ${DOCKER_STORAGE_DIR}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS}
      BACKEND_URL: ${BACKEND_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      OAUTHLIB_INSECURE_TRANSPORT: ${OAUTHLIB_INSECURE_TRANSPORT}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: chessview-frontend
    restart: unless-stopped
    environment:
      VITE_SERVER_URL: ${VITE_SERVER_URL}
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET}
      VITE_WS_PROXY_TARGET: ${VITE_WS_PROXY_TARGET}
    depends_on:
      - backend
    ports:
      - "5173:5173"

  admin-frontend:
    build:
      context: .
      dockerfile: ./admin-frontend/Dockerfile
    container_name: chessview-admin-frontend
    restart: unless-stopped
    environment:
      VITE_SERVER_URL: ${VITE_SERVER_URL}
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET}
      VITE_WS_PROXY_TARGET: ${VITE_WS_PROXY_TARGET}
    depends_on:
      - backend
    ports:
      - "5174:5174"

volumes:
  pgdata:
