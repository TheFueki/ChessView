name: PR CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ vars.CI_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ vars.CI_POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ${{ vars.CI_POSTGRES_USER }} -d ${{ vars.CI_POSTGRES_DB }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
      STORAGE_DIR: ${{ vars.CI_STORAGE_DIR }}
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      JWT_ALGORITHM: ${{ vars.CI_JWT_ALGORITHM }}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${{ vars.CI_ACCESS_TOKEN_EXPIRE_MINUTES }}
      REFRESH_TOKEN_EXPIRE_DAYS: ${{ vars.CI_REFRESH_TOKEN_EXPIRE_DAYS }}
      BACKEND_URL: ${{ vars.CI_BACKEND_URL }}
      FRONTEND_URL: ${{ vars.CI_FRONTEND_URL }}
      CORS_ORIGINS: ${{ vars.CI_CORS_ORIGINS }}
      OAUTHLIB_INSECURE_TRANSPORT: ${{ vars.CI_OAUTHLIB_INSECURE_TRANSPORT }}
      GOOGLE_CLIENT_ID: ${{ secrets.CI_GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.CI_GOOGLE_CLIENT_SECRET }}
      GITHUB_CLIENT_ID: ${{ secrets.CI_GITHUB_CLIENT_ID }}
      GITHUB_CLIENT_SECRET: ${{ secrets.CI_GITHUB_CLIENT_SECRET }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        run: uv sync --locked --dev

      - name: Compile backend sources
        run: uv run python -m compileall app domains infrastructure shared tests

      - name: Apply backend migrations
        run: uv run alembic upgrade head

      - name: Check migration drift
        run: uv run alembic check

      - name: Import backend application
        run: uv run python -c "import app.main"

      - name: Run backend tests
        run: uv run pytest tests

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    env:
      VITE_SERVER_URL: ${{ vars.CI_VITE_SERVER_URL }}
      VITE_API_PROXY_TARGET: ${{ vars.CI_VITE_API_PROXY_TARGET }}
      VITE_WS_PROXY_TARGET: ${{ vars.CI_VITE_WS_PROXY_TARGET }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Run frontend lint
        run: yarn lint

      - name: Build frontend
        run: yarn build
