name: PR CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feat/**
      - fix/**
      - ref/**

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ vars.CI_POSTGRES_USER || 'chessview_ci' }}
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'chessview_ci' }}
          POSTGRES_DB: ${{ vars.CI_POSTGRES_DB || 'chessview_test' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ${{ vars.CI_POSTGRES_USER || 'chessview_ci' }} -d ${{ vars.CI_POSTGRES_DB || 'chessview_test' }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://${{ vars.CI_POSTGRES_USER || 'chessview_ci' }}:${{ secrets.CI_POSTGRES_PASSWORD || 'chessview_ci' }}@localhost:5432/${{ vars.CI_POSTGRES_DB || 'chessview_test' }}
      STORAGE_DIR: ${{ vars.CI_STORAGE_DIR || 'storage' }}
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'ci-jwt-secret' }}
      JWT_ALGORITHM: ${{ vars.CI_JWT_ALGORITHM || 'HS256' }}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${{ vars.CI_ACCESS_TOKEN_EXPIRE_MINUTES || '60' }}
      REFRESH_TOKEN_EXPIRE_DAYS: ${{ vars.CI_REFRESH_TOKEN_EXPIRE_DAYS || '7' }}
      BACKEND_URL: ${{ vars.CI_BACKEND_URL || 'http://localhost:8000' }}
      FRONTEND_URL: ${{ vars.CI_FRONTEND_URL || 'http://localhost:5173' }}
      CORS_ORIGINS: ${{ vars.CI_CORS_ORIGINS || 'http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174' }}
      OAUTHLIB_INSECURE_TRANSPORT: ${{ vars.CI_OAUTHLIB_INSECURE_TRANSPORT || '1' }}
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      GITHUB_CLIENT_ID: ""
      GITHUB_CLIENT_SECRET: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        run: uv sync --locked --dev

      - name: Compile backend sources
        run: uv run python -m compileall app domains infrastructure shared tests

      - name: Apply backend migrations
        run: uv run alembic upgrade head

      - name: Check migration drift
        run: uv run alembic check

      - name: Import backend application
        run: uv run python -c "import app.main"

      - name: Run backend tests
        run: uv run pytest tests

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    env:
      VITE_SERVER_URL: ${{ vars.CI_VITE_SERVER_URL || 'http://localhost:8000' }}
      VITE_API_PROXY_TARGET: ${{ vars.CI_VITE_API_PROXY_TARGET || 'http://localhost:8000' }}
      VITE_WS_PROXY_TARGET: ${{ vars.CI_VITE_WS_PROXY_TARGET || 'ws://localhost:8000' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Run frontend lint
        run: yarn lint

      - name: Run frontend unit tests
        run: yarn test:unit

      - name: Run frontend i18n checks
        run: yarn test:i18n

      - name: Run UI consistency checks
        run: yarn test:ui-consistency

      - name: Build frontend
        run: yarn build

  admin-frontend:
    name: Admin Frontend
    runs-on: ubuntu-latest
    env:
      VITE_SERVER_URL: ${{ vars.CI_VITE_SERVER_URL || 'http://localhost:8000' }}
      VITE_API_PROXY_TARGET: ${{ vars.CI_VITE_API_PROXY_TARGET || 'http://localhost:8000' }}
      VITE_WS_PROXY_TARGET: ${{ vars.CI_VITE_WS_PROXY_TARGET || 'ws://localhost:8000' }}
    defaults:
      run:
        working-directory: admin-frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: admin-frontend/yarn.lock

      - name: Install admin frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck admin frontend
        run: yarn typecheck

      - name: Run admin frontend lint
        run: yarn lint

      - name: Run admin frontend unit tests
        run: yarn test:unit

      - name: Build admin frontend
        run: yarn build

  e2e:
    name: Desktop E2E
    runs-on: ubuntu-latest
    env:
      VITE_SERVER_URL: ${{ vars.CI_VITE_SERVER_URL || 'http://localhost:8000' }}
      VITE_API_PROXY_TARGET: ${{ vars.CI_VITE_API_PROXY_TARGET || 'http://localhost:8000' }}
      VITE_WS_PROXY_TARGET: ${{ vars.CI_VITE_WS_PROXY_TARGET || 'ws://localhost:8000' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install root dependencies
        run: yarn install --frozen-lockfile

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile
        working-directory: frontend

      - name: Install admin frontend dependencies
        run: yarn install --frozen-lockfile
        working-directory: admin-frontend

      - name: Install Playwright browsers
        run: yarn playwright install chromium --with-deps

      - name: Run desktop E2E tests
        run: yarn test:e2e
