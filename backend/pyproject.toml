[project]
name = "chessview-backend"
version = "1.0.1"
description = "ChessView   multiplayer 1v1 chess platform with webcam support"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.135.3",
    "uvicorn[standard]>=0.44.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.15",
    "psycopg[binary]>=3.2",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-chess>=1.999",
    "pyjwt>=2.9",
    "bcrypt>=4.0",
    "python-multipart>=0.0.18",
    "email-validator>=2.0",
    "httpx>=0.27.0",
    "aiofiles>=25.1.0",
    "redis>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
omit = [
    "app/main.py",
    "app/ws_entry.py",
    "*/presentation/router.py",
    "*/presentation/ws_handler.py",
    "*/infrastructure/repository.py",
    "infrastructure/database.py",
    "infrastructure/database_migrations.py",
    "infrastructure/database_registry.py",
    "domains/admin/infrastructure/seed.py",
    "domains/game/presentation/identity_verification.py",
    "domains/game/presentation/runtime.py",
    "domains/scheduled_matches/tournament.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
